services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server/backend
      dockerfile: Dockerfile.server
    container_name: server
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  client:
    build:
      context: ./client/my-app
      dockerfile: Dockerfile.client
    container_name: client
    command: npm run dev -- -p 4000
    volumes:
      - ./client/my-app:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - server

volumes:
  postgres_data: