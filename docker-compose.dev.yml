services:

  cilent:
    build:
      context: ./client/my-app
    container_name: cilent
    ports:
      - "4000:4000"
    volumes:
      - ./client/my-app:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./client/my-app/.env.local
    environment:
      - PORT=4000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    depends_on:
      - server
    command: npm run dev -- -p 4000 -H 0.0.0.0 --webpack
    restart: unless-stopped
    networks:
      - emp-network

  server:
    build:
      context: ./server
    container_name: server
    command: npm run dev
    ports:
      - "4040:4040"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    networks:
      - emp-network

networks:
  emp-network:
    external: true
    name: emp-network